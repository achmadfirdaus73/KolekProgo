name: Cross-Platform KMP CI (Android APK & iOS IPA/Archive)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. ANDROID BUILD JOB
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Secrets & Debug Keystore
        run: |
          echo "Setting up environment files and keystores..."
          # Secrets configuration
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Debug keystore for signing
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: KolekPro-Cam-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: warn

  # =========================================================================
  # 2. IOS BUILD JOB
  # =========================================================================
  build-ios:
    name: Build iOS Archive & IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Secrets
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Verify KMP Shared & iOS Targets
        run: |
          echo "Verifying Kotlin Multiplatform shared logic compilation..."
          ./gradlew compileDebugKotlin --stacktrace

      - name: Build Xcode Archive (Release)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package iOS IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/iosApp.xcarchive/Products/Applications/iosApp.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../KolekProCam.ipa Payload
          cd ../..
          echo "Successfully packaged KolekProCam.ipa"
          ls -lh build/KolekProCam.ipa

      - name: Upload iOS Archive and IPA Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: KolekPro-Cam-iOS-IPA
          path: |
            build/KolekProCam.ipa
            build/iosApp.xcarchive
          retention-days: 1
          if-no-files-found: warn
